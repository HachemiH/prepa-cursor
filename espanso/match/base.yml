  - trigger: ":aud"
    replace: "Effectuer un audit complet du projet NestJS existant en suivant les meilleures pratiques et recommandations NestJS, tout en respectant strictement les conventions définies dans .cursorrules.\n\nObjectif : Réaliser un audit détaillé pour identifier et corriger toutes les non-conformités.\n\nTâches à réaliser :\n1. Vérification de la conformité NestJS :\n   - Vérifier que le projet utilise une architecture modulaire claire :\n     - Chaque domaine possède son propre module.\n     - Les contrôleurs sont bien organisés et respectent les routes associées.\n     - Les services gèrent correctement la logique métier.\n   - Valider l’utilisation correcte des DTOs avec class-validator pour toutes les entrées utilisateur.\n   - S’assurer que les entités utilisent TypeORM de manière appropriée.\n   - Vérifier les services partagés et globaux (exemple : guards, interceptors).\n\n2. Validation des conventions de développement :\n   - Respect strict des conventions TypeScript définies :\n     - Types explicites pour toutes les variables, fonctions et retours.\n     - Pas d’utilisation de any.\n     - Classes courtes (< 200 lignes) et respectant les principes SOLID.\n     - Noms conformes à la nomenclature décrite.\n   - S’assurer que le code suit une organisation propre et modulaire.\n   - Valider que les DTOs ne sont utilisés que pour les entrées API.\n\n3. Test et couverture :\n   - S’assurer que tous les tests respectent :\n     - Le framework Vitest (pas de Jest ou autre).\n     - La structure Arrange → Act → Assert.\n   - Vérifier la présence de tests unitaires, d’intégration et E2E pour chaque module :\n     - Tests des services, contrôleurs et garde-fous.\n     - Couverture des cas d’erreur et des cas limites.\n     - Respect des fichiers de test spécialisés si nécessaires (e.g., *.spec.ts, *.auth.spec.ts).\n\n4. Validation des commits et GitFlow :\n   - Travailler sur des branches **feature/** pour chaque correction identifiée.\n   - Les corrections doivent être engagées avec des **commits atomiques**.\n   - Valider les commits UNIQUEMENT après avoir vérifié que tous les tests passent au vert.\n   - Respecter le format de commit strict : type(scope): subject.\n   - Types autorisés : feat, fix, docs, style, refactor, perf, test, chore.\n\n5. Standardisation des réponses API :\n   - Valider que toutes les réponses suivent le format :\n     interface ApiResponse<T> {\n       message: string;\n       data?: T;\n       statusCode: number;\n     }\n   - Vérifier que les erreurs sont normalisées et explicites.\n\nAction attendue :\n1. Identifier toutes les non-conformités.\n2. Créer une branche feature pour chaque correction.\n3. Implémenter directement les correctifs nécessaires.\n4. Ajouter ou compléter les tests manquants.\n5. Effectuer des commits atomiques une fois les tests passés au vert.\n6. S’assurer que toutes les modifications respectent la roadmap en cours.\n\nContraintes :\n- Aucun écart par rapport aux règles définies dans .cursorrules.\n- Refuser toute action ou correction qui enfreindrait ces règles.\n- Valider systématiquement chaque changement avec des tests."

  - trigger: ':hello'
    replace: 'hello world'
